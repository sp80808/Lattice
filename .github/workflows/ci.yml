name: CI

on:
  pull_request:
  push:
    branches: [main]

# `shell: bash` runs every step with `-eo pipefail`, so a failing command in a
# pipeline fails the step instead of being masked by the last command.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      # The same command contributors run locally; see docs/ci.md.
      - run: scripts/ci-health.sh
