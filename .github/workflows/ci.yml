name: CI

on:
  pull_request:
  push:
    branches: [main]

# `shell: bash` runs every step with `-eo pipefail`, so a failing command in a
# pipeline fails the step instead of being masked by the last command.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      # The same command contributors run locally; see docs/ci.md.
      - run: scripts/ci-health.sh

  # Tessera issue #41: the witness path runs the real `tsr`, never a stub.
  # Bump TESSERA_REF when Lattice should follow a newer compiler build.
  tessera-witness:
    runs-on: ubuntu-latest
    env:
      TESSERA_REF: 798cb798d63265c35e88451a445aaf83301b2de6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sp80808/Tessera
          ref: ${{ env.TESSERA_REF }}
          path: .tessera
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tessera/target
          key: tsr-${{ runner.os }}-${{ env.TESSERA_REF }}
      - run: cargo build --release --locked -p tessera-cli
        working-directory: .tessera
      - run: echo "TSR=$GITHUB_WORKSPACE/.tessera/target/release/tsr" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node scripts/run-node-tests.mjs packages/tessera/dist/e2e.test.js
      - run: node examples/tessera-repair/compare.mjs --seeds 3 --ablation
